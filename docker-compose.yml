name: ad-audit

services:
  ad-security-core:
    build: .
    image: ad-identity-guard:2.2
    container_name: ad-security-core
    env_file: .env
    ports:
      - "9443:8000"
    volumes:
      - ./data:/opt/ad-audit/data
      - ./reports:/opt/ad-audit/reports
      - ./certs:/opt/ad-audit/certs
    networks:
      - audit-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8000/health', context=ctx, timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 25s

networks:
  audit-net:
    name: audit-net
